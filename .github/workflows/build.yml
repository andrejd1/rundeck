# Type-checks and builds RunDeck for every watch in manifest.xml, and checks
# the layout on every screen size.
#
# The SDK download is public; device files are not (the SDK Manager needs a
# Garmin login), so tools/stub-devices.py writes stand-in compiler.json files
# from the SDK's own device reference. Good for type-checking and building,
# not for the simulator or release builds.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_VERSION: 8.3.0-2025-09-22-5813687a0

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generated files are up to date
        run: |
          python3 tools/catalog.py
          git diff --exit-code
      - name: Every layout fits every screen size
        run: python3 tools/preview.py --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Connect IQ SDK
        run: |
          curl -fLsS -o sdk.zip "https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-${SDK_VERSION}.zip"
          unzip -q sdk.zip -d "$RUNNER_TEMP/sdk"
          echo "CIQ_SDK=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Stand-in device files
        run: python3 tools/stub-devices.py "$CIQ_SDK" manifest.xml
      - name: Throwaway developer key
        run: |
          openssl genrsa -out "$RUNNER_TEMP/key.pem" 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/key.der" -nocrypt
          echo "DEV_KEY=$RUNNER_TEMP/key.der" >> "$GITHUB_ENV"
      - name: Build every watch
        run: tools/build.sh all
